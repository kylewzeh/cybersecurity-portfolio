<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Controlled Wazuh cybersecurity lab architecture</title>
<desc id="desc">A local Wazuh server receives telemetry from local Ubuntu and Metasploitable virtual machines, an Azure Ubuntu virtual machine, and a lecturer-hosted server running OWASP Juice Shop over a WireGuard VPN. Kali Linux is a local virtual machine used for authorised testing.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#0d1b2d"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102238"/><stop offset="1" stop-color="#0b1727"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" rx="24" fill="url(#bg)"/>
<g opacity=".12" stroke="#6aaeff"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/><path d="M80 0V720M160 0V720M240 0V720M320 0V720M400 0V720M480 0V720M560 0V720M640 0V720M720 0V720M800 0V720M880 0V720M960 0V720M1040 0V720M1120 0V720"/></g>
<text x="60" y="58" fill="#79baff" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">LAB ARCHITECTURE // CONTROLLED ENVIRONMENT</text><text x="60" y="86" fill="#dcecff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Multi-node Wazuh monitoring &amp; attack/defence lab</text>
<!-- Telemetry links -->
<g stroke="#39d6ff" stroke-width="2" fill="none" opacity=".8"><path d="M600 330L285 185"/><path d="M600 330L285 355"/><path d="M600 330L915 185"/><path d="M600 330L915 355"/></g>
<g fill="#39d6ff" filter="url(#glow)"><circle cx="285" cy="185" r="4"/><circle cx="285" cy="355" r="4"/><circle cx="915" cy="185" r="4"/><circle cx="915" cy="355" r="4"/></g>
<!-- Wazuh -->
<g><rect x="470" y="260" width="260" height="140" rx="16" fill="#0e2137" stroke="#2e8cff" stroke-width="2"/><circle cx="505" cy="295" r="10" fill="#3fe58a"/><text x="525" y="300" fill="#8fc8ff" font-family="monospace" font-size="13" font-weight="700">CENTRAL SIEM</text><text x="500" y="336" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Wazuh Server</text><text x="500" y="362" fill="#9db3ca" font-family="Arial,sans-serif" font-size="14">Local virtual machine</text><text x="500" y="384" fill="#6de3ff" font-family="monospace" font-size="12">LOGS • ALERTS • CORRELATION</text></g>
<!-- Nodes -->
<g fill="url(#node)" stroke="#294761" stroke-width="1.5"><rect x="75" y="130" width="360" height="110" rx="14"/><rect x="75" y="300" width="360" height="110" rx="14"/><rect x="765" y="130" width="360" height="110" rx="14"/><rect x="765" y="300" width="360" height="110" rx="14"/></g>
<g font-family="Arial,sans-serif"><text x="100" y="166" fill="#79baff" font-family="monospace" font-size="12" font-weight="700">LOCAL VM / AGENT</text><text x="100" y="194" fill="#fff" font-size="21" font-weight="700">Ubuntu</text><text x="100" y="218" fill="#9db3ca" font-size="13">Monitored Linux endpoint</text>
<text x="100" y="336" fill="#79baff" font-family="monospace" font-size="12" font-weight="700">LOCAL VM / AGENT</text><text x="100" y="364" fill="#fff" font-size="21" font-weight="700">Metasploitable</text><text x="100" y="388" fill="#9db3ca" font-size="13">Intentionally vulnerable target</text>
<text x="790" y="166" fill="#79baff" font-family="monospace" font-size="12" font-weight="700">CLOUD / AGENT</text><text x="790" y="194" fill="#fff" font-size="21" font-weight="700">Azure Ubuntu</text><text x="790" y="218" fill="#9db3ca" font-size="13">Cloud-hosted monitored endpoint</text>
<text x="790" y="336" fill="#79baff" font-family="monospace" font-size="12" font-weight="700">REMOTE / VPN</text><text x="790" y="364" fill="#fff" font-size="21" font-weight="700">Lecturer-hosted Server</text><text x="790" y="388" fill="#9db3ca" font-size="13">OWASP Juice Shop • WireGuard</text></g>
<!-- Kali local testing node -->
<g><rect x="420" y="480" width="360" height="110" rx="14" fill="url(#node)" stroke="#3d5872" stroke-width="1.5"/><text x="445" y="516" fill="#79baff" font-family="monospace" font-size="12" font-weight="700">LOCAL VM / AUTHORISED TESTING</text><text x="445" y="544" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Kali Linux</text><text x="445" y="568" fill="#9db3ca" font-family="Arial,sans-serif" font-size="13">Security testing against controlled lab targets</text></g>
<!-- Testing arrows -->
<g stroke="#ffb85c" stroke-width="2" fill="none" stroke-dasharray="7 6" opacity=".9"><path d="M600 480L435 400"/><path d="M600 480L435 205"/><path d="M600 480L765 205"/><path d="M600 480L765 400"/></g>
<g fill="#ffb85c"><path d="M442 402l-10-4 8 10z"/><path d="M442 207l-10-5 8 10z"/><path d="M758 207l8-5-2 10z"/><path d="M758 402l8-5-2 10z"/></g>
<g font-family="monospace" font-size="11"><text x="470" y="235" fill="#7f9bb8">CENTRALISED TELEMETRY</text><text x="735" y="235" fill="#7f9bb8">CENTRALISED TELEMETRY</text><text x="615" y="462" fill="#ffcb85">AUTHORISED TESTING</text></g>
<!-- WireGuard indicator -->
<rect x="805" y="420" width="280" height="34" rx="9" fill="#091523" stroke="#2b4864"/><text x="830" y="442" fill="#79baff" font-family="monospace" font-size="11">WIREGUARD VPN // REMOTE LAB PATH</text>
<rect x="60" y="625" width="1080" height="55" rx="12" fill="#091523" stroke="#1d3b58"/><text x="85" y="658" fill="#8ea6bf" font-family="monospace" font-size="12">FLOW:</text><text x="145" y="658" fill="#dcecff" font-family="monospace" font-size="12">Kali testing → lab targets → telemetry → Wazuh alerts → investigation &amp; defensive validation</text>
</svg>