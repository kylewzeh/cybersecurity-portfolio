<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Controlled cybersecurity lab architecture</title>
<desc id="desc">Wazuh server receives telemetry from Ubuntu, Metasploitable, Suricata running GShop, Azure Ubuntu and lecturer-hosted GShop environments. Kali Linux is used for authorised security testing.</desc>
